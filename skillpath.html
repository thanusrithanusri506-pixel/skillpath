<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SkillPath AI</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1b2433;--mu:#5c677d;--pr:#2a8c82;--ac:#6b3fb0;--bd:#dde3ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#121826;--card:#1c2436;--tx:#e8edf6;--mu:#9aa6bd;--pr:#4fc3b6;--ac:#b693f0;--bd:#2d3850;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:19px;margin:0;color:var(--pr);flex:1;min-width:130px}h2{color:var(--ac);margin:4px 0 10px}h3{margin:0 0 6px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--pr);color:#fff;border:0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px}nav button{white-space:nowrap}nav button.on{background:var(--ac);color:#fff;border:0}
main{max-width:980px;margin:auto;padding:6px 14px 40px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:0 0 12px}
pre{background:#0f1626;color:#d7e3ff;padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:#e9d9ff;color:#3b1d70;border-radius:99px;padding:1px 9px;font-size:12px}.warn{border-left:4px solid #d98e04}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
a{color:var(--ac);word-break:break-all}.ok{color:#1c8a3d}.bad{color:#c0392b}label{display:block;margin:6px 0 2px}input,textarea{width:100%}
</style></head><body>
<header><h1>🎓 SkillPath AI</h1><input id="q" placeholder="🔍 Search…" style="width:170px"><button id="lg">தமிழ்/EN</button><button id="th">🌙</button><button id="us"></button></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const S={get(k,d){try{const v=localStorage.getItem('sp_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('sp_'+k,JSON.stringify(v))}catch(e){}}};
let L=S.get('lang','en'),tab='coding',user=S.get('user',null),P=S.get('prog',{weeks:{},quiz:{},days:{}});
const N={coding:['Coding','கோடிங்'],roadmap:['6-Month Roadmap','6 மாத திட்டம்'],apt:['Aptitude','ஆப்டிட்யூட்'],comm:['Communication','தொடர்பு'],res:['Resources','வளங்கள்'],proj:['Projects','திட்டங்கள்'],place:['Placement','பிளேஸ்மென்ட்'],tutor:['AI Tutor','AI ஆசிரியர்']};
const tr=(a,b)=>L=='en'?a:b;
const CODE=[
{t:'Python from zero',ta:'பைதான் அடிப்படை',n:'Python reads top to bottom. Variables store data; if/for control flow; functions reuse code. Practise 30 min daily. | பைதான் மேலிருந்து கீழே ஓடும். Variables தரவை சேமிக்கும்.',c:'name = input("Name: ")\nmarks = [78, 91, 85]\navg = sum(marks)/len(marks)\nif avg >= 80:\n    print(name, "passed with", round(avg,1))\nfor m in marks:\n    print(m)\ndef square(x): return x*x'},
{t:'Java basics',ta:'ஜாவா அடிப்படை',n:'Every Java program lives in a class; main() is the entry point; types are declared. | Java-வில் ஒவ்வொரு program-உம் class-க்குள் இருக்கும்.',c:'public class Main {\n  public static void main(String[] a) {\n    int sum = 0;\n    for (int i = 1; i <= 5; i++) sum += i;\n    System.out.println("Sum = " + sum);\n  }\n}'},
{t:'DSA',ta:'DSA',n:'Learn in order: arrays → strings → hashing → recursion → sorting/searching → stack/queue → linked list → trees → graphs → DP. Know Big-O time for each. | வரிசையாக கற்கவும்.',c:'def binary_search(a, x):\n    lo, hi = 0, len(a)-1\n    while lo <= hi:\n        mid = (lo+hi)//2\n        if a[mid] == x: return mid\n        if a[mid] < x: lo = mid+1\n        else: hi = mid-1\n    return -1   # O(log n)'},
{t:'SQL',ta:'SQL',n:'SELECT, WHERE, ORDER BY, GROUP BY, HAVING, JOINs. Interviews love: 2nd highest salary, duplicates, JOIN types. | SQL interview-ல் JOIN, GROUP BY அதிகம் கேட்பார்கள்.',c:"SELECT dept, COUNT(*) AS n, AVG(salary)\nFROM employees\nWHERE salary > 20000\nGROUP BY dept HAVING COUNT(*) > 2\nORDER BY n DESC;\n\nSELECT MAX(salary) FROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);"},
{t:'AI & Data Science',ta:'AI & டேட்டா சயின்ஸ்',n:'Stack: Python → NumPy → Pandas → Matplotlib → Scikit-learn. Steps: load data, clean, split train/test, fit model, evaluate accuracy. | தரவை சுத்தம் செய்து model-ஐ train செய்யவும்.',c:'import pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LinearRegression\ndf = pd.read_csv("students.csv")\nX, y = df[["hours"]], df["score"]\nXt, Xs, yt, ys = train_test_split(X, y, test_size=0.2)\nm = LinearRegression().fit(Xt, yt)\nprint("R2:", m.score(Xs, ys))'}];
const MAP=[['Python basics: print, variables, input, operators, if-else','Loops, lists, strings, functions','Dictionaries, tuples, sets, files, errors','OOP + 20 HackerRank problems'],['Aptitude: percentages, averages, ratio','Profit-loss, time-work, speed-distance','English: 5-sentence daily speaking','Mini project 1: calculator + GitHub upload'],['Java basics + OOP','Arrays, strings, recursion','Searching & sorting','Stack, queue, linked list'],['Trees, graphs basics','DP intro, greedy','SQL: SELECT to JOINs','SQL practice + 1 DB project'],['NumPy, Pandas','Matplotlib, EDA','Scikit-learn models','ML project (student predictor)'],['Resume + LinkedIn + GitHub polish','Mock tests: aptitude + coding','HR + GD + mock interviews','Apply to companies, revise weak topics']];
const D7=[['Print + Python setup','Basic calculations','Self-introduction'],['Variables + data types','Percentages','Daily routine: 5 sentences'],['Input + operators','Percentage practice','Speak about yourself'],['If-else','Averages','Read aloud for 5 min'],['Loops','Ratio','Describe your day'],['Lists','Profit & loss','Learn 5 new words'],['Revision + mini program','Mock quiz','Record 1-min intro']];
const APT=[['Percentage','x% of y = xy/100; increase then decrease by x% → net loss x²/100 %','Price ₹200 rises 10% → ₹220. Trick: 10% = divide by 10.'],['Average','Avg = sum/count; new avg after adding x = (old sum + x)/(n+1)','Avg of 10,20,30 = 20.'],['Profit & Loss','Profit% = (SP−CP)/CP×100; SP = CP×(100+P)/100','CP 500, SP 600 → 20%.'],['Time & Work','Work = rate × time; A in a days, B in b days → together ab/(a+b)','6 and 12 days → 4 days.'],['Speed & Distance','D = S×T; km/h→m/s multiply 5/18; avg speed (same distance) = 2xy/(x+y)','72 km/h = 20 m/s.'],['Ratio','a:b, total parts = a+b; share = part/total × amount','Split ₹500 in 2:3 → 200, 300.'],['Simple/Compound Interest','SI = PRT/100; CI amount = P(1+R/100)^T','₹1000, 10%, 2y: SI 200, CI 210.'],['Permutation/Combination','nPr = n!/(n−r)!; nCr = n!/(r!(n−r)!)','5C2 = 10.'],['Probability','P = favourable/total','Die, even number → 3/6 = 1/2.'],['Number series & Age','Check differences, squares, ×2 patterns; age: form equations','2,6,12,20 → +4,+6,+8 → 30.']];
const QB={python:[['Output of print(2**3)?',['6','8','9','5'],1],['Which is mutable?',['tuple','string','list','int'],2],['Keyword to define a function?',['func','def','fun','define'],1],['len([1,2,3])?',['2','3','4','error'],1]],apt:[['20% of 250?',['40','50','60','25'],1],['Avg of 10,20,30?',['15','25','20','30'],2],['72 km/h in m/s?',['20','25','15','10'],0],['CP 500, SP 600: profit %?',['10','20','25','15'],1]],sql:[['Which clause filters groups?',['WHERE','HAVING','ORDER BY','LIMIT'],1],['Which removes duplicates?',['UNIQUE ROWS','DISTINCT','ONLY','SINGLE'],1],['JOIN returning only matching rows?',['LEFT','FULL','INNER','CROSS'],2],['Aggregate to count rows?',['SUM','COUNT','AVG','ROWS'],1]],dsa:[['Binary search time?',['O(n)','O(log n)','O(n²)','O(1)'],1],['Stack order?',['FIFO','LIFO','Random','Sorted'],1],['Queue order?',['LIFO','FIFO','Random','Sorted'],1],['Hash lookup average?',['O(1)','O(n)','O(log n)','O(n²)'],0]]};
const COMM=[['Daily speaking (10 min)','Day 1 introduce yourself → Day 2 describe your day → Day 3 talk about your college → record voice, listen, fix 1 mistake daily.'],['Grammar priorities','Tenses, subject-verb agreement, articles (a/an/the), prepositions. Do 10 sentences daily.'],['Vocabulary','Learn 5 words/day. Use each in your own sentence. Revise every Sunday.'],['Group Discussion','Start with a definition, give 2 points, one example, respect others, conclude. Practise topics: AI & jobs, social media, work from home.'],['Interview skills','Tell me about yourself = Present (study) → Skills → Projects → Goal. 60–90 seconds. Eye contact, honest answers, ask 1 question at the end.']];
const RES=[['Python in Tamil — Error Makes Clever (YouTube search)','https://www.youtube.com/results?search_query=Error+Makes+Clever+Python+Tamil'],['Python full course — freeCodeCamp (YouTube search)','https://www.youtube.com/results?search_query=freeCodeCamp+Python+for+Beginners+full+course'],['Aptitude in Tamil — placement basics (YouTube search)','https://www.youtube.com/results?search_query=placement+aptitude+Tamil+beginners'],['English speaking — BBC Learning English','https://www.youtube.com/@bbclearningenglish'],['HackerRank Python','https://www.hackerrank.com/domains/python'],['W3Schools Python','https://www.w3schools.com/python/'],['W3Schools SQL','https://www.w3schools.com/sql/'],['W3Schools Java','https://www.w3schools.com/java/'],['GitHub — save and share projects','https://github.com/']];
const PRJ=[['Beginner','Calculator & Number Guessing Game','Python: input, loops, if-else. Make 3 functions, add error handling.'],['Beginner','To-Do List (file storage)','Use lists + file read/write. Add, delete, mark done.'],['Intermediate','Student Management (SQL)','Design tables, write CRUD queries, connect with Python sqlite3.'],['Intermediate','Portfolio Website','HTML/CSS/JS; host free on GitHub Pages.'],['Advanced','Student Performance Predictor','Pandas clean → Scikit-learn model → Streamlit UI.'],['Advanced','Chatbot / Resume Analyzer','NLP basics + API integration.']];
const CHK=['Resume (1 page, ATS-friendly) ready','GitHub with 3+ projects','LinkedIn profile updated','50+ DSA problems solved','SQL: joins & group by practised','Aptitude: 5 mock tests done','5 mock HR interviews','Self-introduction memorised','Company research for each drive'];
const HR=['Tell me about yourself.','Strengths and weaknesses?','Why should we hire you?','Where do you see yourself in 5 years?','Describe a challenge you solved.','Are you willing to relocate?'];
const TQ=['Difference between list and tuple?','What is OOP? Name 4 pillars.','Explain primary key vs foreign key.','Array vs linked list?','What is overfitting in ML?','Explain INNER vs LEFT JOIN.'];
const KB=[[['loop','லூப்'],'Loop repeats code. for i in range(5): print(i) prints 0–4. | Loop ஒரே code-ஐ மீண்டும் இயக்கும்.'],[['list','லிஸ்ட்'],'List = ordered, changeable collection: a=[1,2]; a.append(3). | List-ல் மதிப்புகளை சேர்க்கலாம்.'],[['join'],'INNER JOIN gives matching rows from both tables; LEFT JOIN keeps all left rows. | INNER JOIN பொருந்தும் rows மட்டும்.'],[['function','def'],'Function = reusable block: def add(a,b): return a+b. | Function ஒரே code-ஐ பலமுறை பயன்படுத்த உதவும்.'],[['percent','சதவீதம்'],'x% of y = x×y/100. | 20% of 250 = 50.'],[['recursion'],'A function calling itself with a base case. factorial(n)=n*factorial(n-1). | Base case அவசியம்.']];
const e=id=>document.getElementById(id),$=(h)=>e('m').innerHTML=h,esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const save=()=>S.set('prog',P);
function nav(){e('nav').innerHTML=Object.keys(N).map(k=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${N[k][L=='en'?0:1]}</button>`).join('');e('us').textContent=user?'👤 '+user.name:tr('Login','உள்நுழை');e('q').placeholder=tr('🔍 Search…','🔍 தேடு…')}
function go(k){tab=k;nav();R[k]()}
function dl(name,text){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click()}catch(x){}
 const t=document.getElementById('cp');if(t){t.style.display='block';t.value=text;t.select()}}
function allNotes(){return 'SKILLPATH AI NOTES\n\n'+CODE.map(c=>`## ${c.t}\n${c.n}\n${c.c}\n`).join('\n')+'\nAPTITUDE FORMULAS\n'+APT.map(a=>`${a[0]}: ${a[1]} (e.g. ${a[2]})`).join('\n')}
const R={
coding(){$(`<h2>${tr('Coding','கோடிங்')}</h2><button class=p onclick="dl('skillpath-notes.txt',allNotes())">⬇ ${tr('Download notes','நோட்ஸ் பதிவிறக்கு')}</button> <textarea id=cp rows=8 style="display:none;margin-top:8px" readonly></textarea><p class=mu>${tr('If the download is blocked, the notes appear above to copy.','பதிவிறக்கம் தடுக்கப்பட்டால் மேலே நோட்ஸ் தோன்றும்.')}</p>`+CODE.map(c=>`<div class=card><h3>${tr(c.t,c.ta)}</h3><p>${esc(c.n)}</p><pre>${esc(c.c)}</pre></div>`).join('')+'<div class=card><h3>'+tr('Practice','பயிற்சி')+'</h3><a target=_blank href="https://www.hackerrank.com/domains/python">HackerRank Python</a></div>')},
roadmap(){const t=24,d=Object.values(P.weeks).filter(Boolean).length,p=Math.round(d/t*100);
 $(`<h2>${tr('6-Month Roadmap','6 மாத திட்டம்')}</h2><div class=card><b>${tr('Progress','முன்னேற்றம்')}: ${p}%</b> (${d}/${t} ${tr('weeks','வாரங்கள்')})<div class=bar><i style="width:${p}%"></i></div><p class=mu>${tr('Daily: 2h coding + 1h aptitude + 30m speaking. Sunday = revision.','தினம்: 2ம கோடிங் + 1ம ஆப்டிட்யூட் + 30நி பேச்சு. ஞாயிறு = revision.')}</p></div>`+MAP.map((m,i)=>`<div class=card><h3>${tr('Month','மாதம்')} ${i+1}</h3>`+m.map((w,j)=>{const k=i*4+j;return `<label style="display:flex;gap:8px;align-items:center"><input type=checkbox style="width:auto" ${P.weeks[k]?'checked':''} onchange="P.weeks[${k}]=this.checked;save();R.roadmap()"> ${tr('Week','வாரம்')} ${j+1}: ${w}</label>`}).join('')+'</div>').join('')+`<div class=card><h3>${tr('First 7 days — start here','முதல் 7 நாட்கள்')}</h3><div style="overflow-x:auto"><table width=100% cellpadding=6><tr><th>Day<th>Coding<th>Aptitude<th>Communication</tr>${D7.map((r,i)=>`<tr><td><input type=checkbox style="width:auto" ${P.days[i]?'checked':''} onchange="P.days[${i}]=this.checked;save()"> ${i+1}<td>${r.join('<td>')}</tr>`).join('')}</table></div></div>`)},
apt(){$(`<h2>${tr('Aptitude','ஆப்டிட்யூட்')}</h2>`+APT.map(a=>`<div class=card><h3>${a[0]}</h3><b>${tr('Formula','சூத்திரம்')}:</b> ${a[1]}<br><b>${tr('Solved','தீர்வு')}:</b> ${a[2]}</div>`).join('')+'<div id=qz></div>');quiz('apt','qz')},
comm(){$(`<h2>${tr('Communication','தொடர்பு')}</h2>`+COMM.map(c=>`<div class=card><h3>${c[0]}</h3>${c[1]}</div>`).join('')+`<div class=card><h3>${tr('Today’s speaking prompt','இன்றைய பேச்சு தலைப்பு')}</h3><span id=pr></span><br><button onclick="e('pr').textContent=['Describe your best friend','Why did you choose AI & DS?','Your dream job','A challenge you overcame'][Math.random()*4|0]">🎲 ${tr('New prompt','புதிய தலைப்பு')}</button></div>`)},
res(){$(`<h2>${tr('Learning Resources','வளங்கள்')}</h2><div class="card warn">⚠ ${tr('Links were not live-checked by the builder. YouTube “search” links always open results; open each once and save the channel you like.','இணைப்புகள் நேரடியாக சோதிக்கப்படவில்லை. YouTube search இணைப்புகள் முடிவுகளைக் காட்டும்.')}</div>`+RES.map(r=>`<div class=card>${r[0]}<br><a target=_blank rel=noopener href="${r[1]}">${r[1]}</a></div>`).join(''))},
proj(){$(`<h2>${tr('Projects','திட்டங்கள்')}</h2>`+PRJ.map(p=>`<div class=card><span class=tag>${p[0]}</span><h3>${p[1]}</h3>${p[2]}</div>`).join('')+`<div class=card><h3>GitHub</h3><pre>git init\ngit add .\ngit commit -m "first commit"\ngit branch -M main\ngit remote add origin https://github.com/YOU/repo.git\ngit push -u origin main</pre>${tr('Write a README: what, how to run, screenshots.','README எழுதவும்: என்ன, எப்படி இயக்குவது.')}</div>`)},
place(){const ck=S.get('chk',{}),r=S.get('resume',{});
 $(`<h2>${tr('Placement','பிளேஸ்மென்ட்')}</h2><div class=card><h3>${tr('Resume builder','ரெஸ்யூம்')}</h3>`+['name','email','skills','projects','education'].map(f=>`<label>${f}</label><input id=r_${f} value="${esc(r[f]||'')}">`).join('')+`<br><br><button class=p onclick="mk()">${tr('Generate','உருவாக்கு')}</button><textarea id=cp rows=10 style="display:none;margin-top:8px"></textarea></div><div class=card><h3>${tr('Checklist','சரிபார்ப்பு பட்டியல்')}</h3>`+CHK.map((c,i)=>`<label style="display:flex;gap:8px"><input type=checkbox style="width:auto" ${ck[i]?'checked':''} onchange="ck=S.get('chk',{});ck[${i}]=this.checked;S.set('chk',ck)"> ${c}</label>`).join('')+`</div><div class=card><h3>HR</h3>${HR.map(x=>'• '+x).join('<br>')}</div><div class=card><h3>${tr('Technical','டெக்னிக்கல்')}</h3>${TQ.map(x=>'• '+x).join('<br>')}</div><div id=qz></div>`);quiz('python','qz')},
tutor(){$(`<h2>${tr('AI Tutor','AI ஆசிரியர்')}</h2><div class="card warn">⚠ ${tr('Needs API integration: this demo answers from a small built-in keyword list only. A real LLM tutor needs a secure backend that calls the Claude API (key kept on the server).','API இணைப்பு தேவை: இது சிறிய keyword பட்டியலில் இருந்து மட்டும் பதிலளிக்கும். உண்மையான AI-க்கு server தேவை.')}</div><div class=card><input id=ask placeholder="${tr('Ask: loop, list, join, recursion…','கேளுங்கள்…')}"><br><br><button class=p onclick="ans()">${tr('Explain','விளக்கு')}</button><p id=ao></p></div><div class=card><h3>${tr('Study plan','படிப்பு திட்டம்')}</h3><select id=hr><option>1<option>2<option selected>3<option>4</select> h/day <select id=gl><option value=coding>Coding<option value=aptitude>Aptitude<option value=both>Both</select> <button onclick="plan()">${tr('Create','உருவாக்கு')}</button><pre id=pl style="display:none"></pre></div><div class=card><h3>${tr('Quiz generator','வினாடி வினா')}</h3>${Object.keys(QB).map(k=>`<button onclick="quiz('${k}','qz')">${k}</button> `).join('')}</div><div id=qz></div>`)}};
function ans(){const q=e('ask').value.toLowerCase(),k=KB.find(x=>x[0].some(w=>q.includes(w)));e('ao').textContent=k?k[1]:tr('Not in the built-in list. Try: loop, list, join, function, percent, recursion.','பட்டியலில் இல்லை. loop, list, join முயற்சிக்கவும்.')}
function plan(){const h=+e('hr').value,g=e('gl').value,c=g=='aptitude'?0:h*.6,a=g=='coding'?0:h*.3;e('pl').style.display='block';e('pl').textContent=`Daily ${h}h plan\nCoding: ${c.toFixed(1)}h\nAptitude: ${a.toFixed(1)}h\nSpeaking: 0.5h\nSunday: revision + mock quiz`}
function mk(){const f={};['name','email','skills','projects','education'].forEach(k=>f[k]=e('r_'+k).value);S.set('resume',f);dl('resume.txt',`${f.name}\n${f.email}\n\nEDUCATION\n${f.education}\n\nSKILLS\n${f.skills}\n\nPROJECTS\n${f.projects}\n`)}
function quiz(k,id){const qs=QB[k];let i=0,s=0;const box=e(id);function draw(){if(i>=qs.length){const b=Math.max(P.quiz[k]||0,s);P.quiz[k]=b;save();box.innerHTML=`<div class=card><h3>${k} ${tr('quiz','வினாடி வினா')}</h3>${tr('Score','மதிப்பெண்')}: ${s}/${qs.length} · ${tr('Best','சிறந்தது')}: ${b}<br><button onclick="quiz('${k}','${id}')">↻</button></div>`;return}
 const q=qs[i];box.innerHTML=`<div class=card><h3>${k} Q${i+1}/${qs.length}</h3>${q[0]}<br>`+q[1].map((o,j)=>`<button style="margin:5px 5px 0 0" data-j=${j}>${o}</button>`).join('')+'<p id=fb></p></div>';
 box.querySelectorAll('button[data-j]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.j==q[2];if(ok)s++;e('fb').innerHTML=ok?'<span class=ok>✔</span>':'<span class=bad>✘ '+q[1][q[2]]+'</span>';box.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>{i++;draw()},900)})}draw()}
e('lg').onclick=()=>{L=L=='en'?'ta':'en';S.set('lang',L);document.documentElement.lang=L;go(tab)};
e('th').onclick=()=>{const d=document.documentElement.dataset.theme!='dark';document.documentElement.dataset.theme=d?'dark':'light';S.set('theme',d?'dark':'light')};
e('us').onclick=()=>{if(user){if(confirm('Log out?')){user=null;S.set('user',null);nav()}}else{const n=prompt('Name (demo login, saved only in this browser)');if(n){user={name:n};S.set('user',user);nav()}}};
e('q').oninput=()=>{const q=e('q').value.toLowerCase().trim();if(!q)return go(tab);const h=[];CODE.forEach(c=>(c.t+c.n).toLowerCase().includes(q)&&h.push(['Coding',c.t]));APT.forEach(a=>a.join(' ').toLowerCase().includes(q)&&h.push(['Aptitude',a[0]]));RES.forEach(r=>r[0].toLowerCase().includes(q)&&h.push(['Resources',r[0]]));PRJ.forEach(p=>p.join(' ').toLowerCase().includes(q)&&h.push(['Projects',p[1]]));$(`<h2>${h.length} ${tr('results','முடிவுகள்')}</h2>`+h.map(x=>`<div class=card><span class=tag>${x[0]}</span> ${x[1]}</div>`).join(''))};
document.documentElement.dataset.theme=S.get('theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
nav();R.coding();
</script></body></html>
